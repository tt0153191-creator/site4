<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Jet & Mines Premium Signals</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap');

        :root {
            --primary-purple: #9d00ff;
            --bright-purple: #c342ff;
            --accent-glow: rgba(189, 0, 255, 0.8);
            --bg-dark: #05040d;
            --text-white: #ffffff;
            --mine-blue-grad: linear-gradient(145deg, #235d81, #0a2535);
            --mine-active-grad: linear-gradient(145deg, #9d00ff, #440066);
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg-dark);
            font-family: 'Roboto', sans-serif;
            height: 100vh;
            color: var(--text-white);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* --- AUTH OVERLAY --- */
        #authOverlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 4, 13, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(20px);
            transition: opacity 0.5s ease, visibility 0.5s;
        }

        .auth-card {
            background: rgba(20, 20, 40, 0.8);
            padding: 40px;
            border-radius: 30px;
            border: 2px solid var(--primary-purple);
            box-shadow: 0 0 50px rgba(157, 0, 255, 0.3);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }

        .auth-card h2 {
            margin-top: 0;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--bright-purple);
        }

        .auth-card p {
            color: #ccc;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .auth-input {
            width: 100%;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(157, 0, 255, 0.5);
            border-radius: 12px;
            color: white;
            font-size: 18px;
            text-align: center;
            margin-bottom: 20px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }

        .auth-input:focus {
            border-color: var(--bright-purple);
        }

        .auth-btn {
            width: 100%;
            padding: 15px;
            background: var(--primary-purple);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .auth-btn:hover {
            box-shadow: 0 0 20px var(--primary-purple);
        }

        .auth-btn:active {
            transform: scale(0.95);
        }

        /* --- CONTENT BLUR --- */
        #mainContent {
            filter: blur(15px);
            transition: filter 0.8s ease;
            height: 100%;
            display: flex;
            flex-direction: column;
            pointer-events: none;
        }

        #mainContent.unlocked {
            filter: blur(0);
            pointer-events: auto;
        }

        #starBackground {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .tabs {
            display: flex;
            background: rgba(15, 12, 41, 0.95);
            backdrop-filter: blur(15px);
            padding: 15px;
            gap: 15px;
            justify-content: center;
            z-index: 100;
            border-bottom: 2px solid rgba(157, 0, 255, 0.4);
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(157, 0, 255, 0.5);
            color: white;
            padding: 12px 25px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 900;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: var(--primary-purple);
            box-shadow: 0 0 25px var(--primary-purple);
            border-color: var(--bright-purple);
        }

        .game-view {
            flex: 1;
            display: none;
            position: relative;
            flex-direction: column;
            align-items: center;
            z-index: 1;
        }

        .game-view.active { display: flex; }

        #gameCanvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
        }

        .multiplier-display {
            position: absolute;
            top: 38%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: clamp(3.5rem, 12vw, 7rem);
            font-weight: 900;
            color: var(--bright-purple);
            text-shadow: 0 0 30px var(--bright-purple), 0 0 60px rgba(189, 0, 255, 0.5);
            z-index: 5;
            pointer-events: none;
        }

        .controls {
            position: absolute;
            bottom: 30px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .selector-container {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 20px;
            border-radius: 15px;
            border: 1px solid rgba(157, 0, 255, 0.3);
            margin-bottom: 10px;
        }

        .selector-label {
            font-weight: 700;
            font-size: 14px;
            color: #aaa;
            text-transform: uppercase;
        }

        .mine-count-display {
            font-size: 24px;
            font-weight: 900;
            color: var(--bright-purple);
            min-width: 30px;
            text-align: center;
        }

        .stepper-btn {
            background: var(--primary-purple);
            border: none;
            color: white;
            width: 35px;
            height: 35px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .stepper-btn:active { transform: scale(0.9); }

        .signal-btn {
            background: linear-gradient(135deg, #9d00ff 0%, #7d00cc 100%);
            border: 2px solid rgba(255,255,255,0.2);
            padding: 20px 0;
            font-size: 20px;
            font-weight: 900;
            color: white;
            border-radius: 20px;
            cursor: pointer;
            text-transform: uppercase;
            width: 360px;
            max-width: 92%;
            box-shadow: 0 0 35px var(--accent-glow);
            transition: all 0.4s cubic-bezier(0.2, 1, 0.3, 1);
        }

        .signal-btn:disabled {
            background: #1a1a1a;
            box-shadow: none;
            color: #444;
            border-color: #222;
        }

        .mines-container {
            margin-top: 40px;
            background: rgba(10, 20, 35, 0.95);
            padding: 15px;
            border-radius: 28px;
            border: 3px solid #1e2a3a;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
        }

        .mines-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            width: 300px;
            height: 300px;
        }

        .mine-cell {
            background: var(--mine-blue-grad);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .mine-cell.active {
            background: var(--mine-active-grad);
            box-shadow: inset 0 0 15px rgba(195, 66, 255, 0.5), 0 0 20px var(--primary-purple);
            border-color: var(--bright-purple);
            transform: scale(1.05);
        }

        .star-icon {
            width: 70%;
            height: 70%;
            fill: #fff;
            filter: drop-shadow(0 0 5px #fff);
            opacity: 0;
            transform: scale(0) rotate(-45deg);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .mine-cell.active .star-icon {
            opacity: 1;
            transform: scale(1) rotate(0deg);
        }

        .error-msg {
            color: #ff4d4d;
            font-size: 12px;
            margin-bottom: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <!-- ОКНО АВТОРИЗАЦИИ -->
    <div id="authOverlay">
        <div class="auth-card">
            <h2>Авторизация</h2>
            <p>Введите ваш 1win ID для доступа к премиум сигналам</p>
            <div id="authError" class="error-msg">Некорректный ID. Минимум 6 цифр.</div>
            <input type="number" id="idInput" class="auth-input" placeholder="ID (например: 12345678)">
            <button id="loginBtn" class="auth-btn">Войти</button>
        </div>
    </div>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <div id="mainContent">
        <canvas id="starBackground"></canvas>

        <nav class="tabs">
            <button class="tab-btn active" onclick="switchTab('luckyjet')">LUCKY JET</button>
            <button class="tab-btn" onclick="switchTab('mines')">MINES</button>
        </nav>

        <!-- Вкладка Lucky Jet -->
        <div id="luckyjetView" class="game-view active">
            <canvas id="gameCanvas"></canvas>
            <div id="counter" class="multiplier-display">x1.00</div>
            <div class="controls">
                <button id="jetBtn" class="signal-btn">ПОЛУЧИТЬ СИГНАЛ</button>
            </div>
        </div>

        <!-- Вкладка Mines -->
        <div id="minesView" class="game-view">
            <div class="mines-container">
                <div id="minesGrid" class="mines-grid"></div>
            </div>
            <div class="controls">
                <div class="selector-container">
                    <span class="selector-label">Ловушки:</span>
                    <button class="stepper-btn" onclick="updateMineCount(-1)">−</button>
                    <div id="mineCountDisplay" class="mine-count-display">3</div>
                    <button class="stepper-btn" onclick="updateMineCount(1)">+</button>
                </div>
                <button id="minesBtn" class="signal-btn">ПОЛУЧИТЬ СИГНАЛ</button>
            </div>
        </div>
    </div>

    <script>
        // --- ЛОГИКА АВТОРИЗАЦИИ ---
        const authOverlay = document.getElementById('authOverlay');
        const mainContent = document.getElementById('mainContent');
        const loginBtn = document.getElementById('loginBtn');
        const idInput = document.getElementById('idInput');
        const authError = document.getElementById('authError');

        loginBtn.addEventListener('click', () => {
            const userId = idInput.value;
            // Проверка: ID должен быть не менее 6 цифр
            if (userId.length >= 6) {
                authOverlay.style.opacity = '0';
                setTimeout(() => {
                    authOverlay.style.visibility = 'hidden';
                    mainContent.classList.add('unlocked');
                }, 500);
            } else {
                authError.style.display = 'block';
                idInput.style.borderColor = '#ff4d4d';
            }
        });

        // --- ОБРАБОТКА ИЗОБРАЖЕНИЯ ---
        let processedJoe = null;
        const luckyJoeImg = new Image();
        luckyJoeImg.crossOrigin = "anonymous";
        luckyJoeImg.src = "https://yt3.googleusercontent.com/DxUsF2Faj_l76Z-2Daj1WlM5to6QK_Tv4D1dCnslf7tzxJHS2RF5guuY-xTF6Nw3I_KJMLFaFQ=s900-c-k-c0x00ffffff-no-rj"; 

        luckyJoeImg.onload = function() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = luckyJoeImg.width;
            canvas.height = luckyJoeImg.height;
            ctx.drawImage(luckyJoeImg, 0, 0);
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
                const r = data[i], g = data[i+1], b = data[i+2];
                const brightness = (r + g + b) / 3;
                if (brightness > 230) data[i + 3] = 0; 
                else if (brightness > 200) data[i + 3] = (255 - brightness) * 4;
            }
            ctx.putImageData(imageData, 0, 0);
            processedJoe = canvas;
        };

        // --- ФОН СО ЗВЕЗДАМИ ---
        const starCanvas = document.getElementById('starBackground');
        const sCtx = starCanvas.getContext('2d');
        let stars = [];

        function initStars() {
            starCanvas.width = window.innerWidth;
            starCanvas.height = window.innerHeight;
            stars = [];
            for(let i=0; i<150; i++) {
                stars.push({
                    x: Math.random() * starCanvas.width,
                    y: Math.random() * starCanvas.height,
                    size: Math.random() * 1.5,
                    opacity: Math.random(),
                    speed: 0.005 + Math.random() * 0.01
                });
            }
        }

        function drawStars() {
            sCtx.clearRect(0,0,starCanvas.width, starCanvas.height);
            stars.forEach(s => {
                s.opacity += s.speed;
                if(s.opacity > 1 || s.opacity < 0) s.speed *= -1;
                sCtx.globalAlpha = Math.max(0, Math.abs(s.opacity));
                sCtx.fillStyle = "white";
                sCtx.beginPath();
                sCtx.arc(s.x, s.y, s.size, 0, Math.PI*2);
                sCtx.fill();
            });
            requestAnimationFrame(drawStars);
        }

        // --- LUCKY JET ЛОГИКА ---
        const jetCanvas = document.getElementById('gameCanvas');
        const jCtx = jetCanvas.getContext('2d');
        let jWidth, jHeight, isFlying = false, isFalling = false;
        let currentX = 1.0, targetX = 1.0, startTime = 0, fallTime = 0;
        let jetPos = { x: 60, y: 0 };
        let rotation = -0.3;

        function resizeJet() {
            jWidth = jetCanvas.width = window.innerWidth;
            jHeight = jetCanvas.height = window.innerHeight;
        }

        function getTrajectory(t, startX, startY, width, height) {
            const px = startX + (width * 0.7) * t;
            const py = startY - (startY * 0.85) * Math.pow(t, 1.5); 
            return { x: px, y: py };
        }

        function drawLuckyJet() {
            jCtx.clearRect(0,0,jWidth, jHeight);
            jCtx.imageSmoothingEnabled = true;
            const startX = 60;
            const startY = jHeight - 120;

            if (isFlying) {
                const elapsed = Date.now() - startTime;
                const duration = 3000;
                const t = Math.min(elapsed / duration, 1);
                
                jetPos = getTrajectory(t, startX, startY, jWidth, jHeight);
                rotation = -0.3;
                
                jCtx.save();
                jCtx.beginPath();
                jCtx.moveTo(startX, startY);
                for (let i = 0; i <= t; i += 0.01) {
                    const p = getTrajectory(i, startX, startY, jWidth, jHeight);
                    jCtx.lineTo(p.x, p.y);
                }
                jCtx.strokeStyle = "#9d00ff";
                jCtx.lineWidth = 4;
                jCtx.lineCap = "round";
                jCtx.stroke();
                jCtx.restore();

                if (currentX < targetX) {
                    currentX = 1.0 + (targetX - 1.0) * t;
                }

                if (t >= 1) {
                    currentX = targetX;
                    isFlying = false;
                    isFalling = true; 
                    fallTime = Date.now();
                }
            } else if (isFalling) {
                const elapsedFall = Date.now() - fallTime;
                const tFall = elapsedFall / 1000;
                jetPos.y += (30 * tFall * 30); 
                rotation += 0.2;

                if (jetPos.y > jHeight + 150) {
                    isFalling = false;
                    document.getElementById('jetBtn').disabled = false;
                }
            } else {
                jetPos.x = startX;
                jetPos.y = startY;
                rotation = 0;
            }

            jCtx.save();
            jCtx.translate(jetPos.x, jetPos.y);
            jCtx.rotate(rotation);
            const hover = (isFlying || !isFalling) ? Math.sin(Date.now() / 150) * 4 : 0;
            jCtx.translate(0, hover);
            if (processedJoe) {
                const h = 100; const w = processedJoe.width * (h / processedJoe.height);
                jCtx.drawImage(processedJoe, -w * 0.5, -h * 0.7, w, h);
            }
            jCtx.restore();

            document.getElementById('counter').innerText = 'x' + currentX.toFixed(2);
            requestAnimationFrame(drawLuckyJet);
        }

        // --- MINES ЛОГИКА ---
        const starSvg = `<svg class="star-icon" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 22 12 18.27 5.82 22 7 14.14l-5-4.87 6.91-1.01L12 2z"/></svg>`;
        let selectedMines = 3;

        function updateMineCount(delta) {
            selectedMines = Math.max(1, Math.min(24, selectedMines + delta));
            document.getElementById('mineCountDisplay').innerText = selectedMines;
        }

        function initMinesGrid() {
            const grid = document.getElementById('minesGrid');
            grid.innerHTML = '';
            for (let i = 0; i < 25; i++) {
                const cell = document.createElement('div');
                cell.className = 'mine-cell';
                cell.innerHTML = starSvg;
                grid.appendChild(cell);
            }
        }

        document.getElementById('minesBtn').addEventListener('click', function() {
            const btn = this;
            btn.disabled = true;
            const cells = document.querySelectorAll('.mine-cell');
            cells.forEach(c => c.classList.remove('active'));

            let starsToReveal = Math.max(1, Math.min(25 - selectedMines, 5 + Math.floor(Math.random() * 3)));
            const indices = [];
            while(indices.length < starsToReveal) {
                const r = Math.floor(Math.random() * 25);
                if(!indices.includes(r)) indices.push(r);
            }

            indices.forEach((idx, i) => {
                setTimeout(() => {
                    cells[idx].classList.add('active');
                    if(i === indices.length - 1) setTimeout(() => { btn.disabled = false; }, 500);
                }, i * 200);
            });
        });

        document.getElementById('jetBtn').addEventListener('click', function() {
            this.disabled = true;
            targetX = 1.25 + Math.random() * 9;
            currentX = 1.0;
            startTime = Date.now();
            isFlying = true;
            isFalling = false;
        });

        function switchTab(tab) {
            document.querySelectorAll('.game-view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if(tab === 'luckyjet') {
                document.getElementById('luckyjetView').classList.add('active');
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
            } else {
                document.getElementById('minesView').classList.add('active');
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                initMinesGrid();
            }
        }

        window.addEventListener('resize', () => { initStars(); resizeJet(); });
        initStars();
        drawStars();
        resizeJet();
        drawLuckyJet();
        initMinesGrid();
    </script>
</body>
</html>
