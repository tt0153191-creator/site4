<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Jet & Mines Premium Signals</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap');

        :root {
            --primary-purple: #9d00ff;
            --bright-purple: #c342ff;
            --accent-glow: rgba(189, 0, 255, 0.7);
            --bg-dark: #05040d;
            --text-white: #ffffff;
            --mine-blue-grad: linear-gradient(145deg, #235d81, #0a2535);
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg-dark);
            font-family: 'Roboto', sans-serif;
            height: 100vh;
            color: var(--text-white);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Динамический звездный фон */
        #starBackground {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Навигация */
        .tabs {
            display: flex;
            background: rgba(15, 12, 41, 0.9);
            backdrop-filter: blur(15px);
            padding: 15px;
            gap: 15px;
            justify-content: center;
            z-index: 100;
            border-bottom: 2px solid rgba(157, 0, 255, 0.4);
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(157, 0, 255, 0.5);
            color: white;
            padding: 12px 25px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 900;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: var(--primary-purple);
            box-shadow: 0 0 25px var(--primary-purple);
            border-color: var(--bright-purple);
        }

        .game-view {
            flex: 1;
            display: none;
            position: relative;
            flex-direction: column;
            align-items: center;
            z-index: 1;
        }

        .game-view.active { display: flex; }

        /* Lucky Jet Canvas */
        #gameCanvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
        }

        .multiplier-display {
            position: absolute;
            top: 35%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: clamp(3.5rem, 12vw, 7rem);
            font-weight: 900;
            color: var(--bright-purple);
            text-shadow: 0 0 30px var(--bright-purple), 0 0 60px rgba(189, 0, 255, 0.5);
            z-index: 5;
            pointer-events: none;
        }

        /* Mines */
        .mines-container {
            margin-top: 40px;
            background: rgba(10, 20, 35, 0.95);
            padding: 20px;
            border-radius: 28px;
            border: 3px solid #1e2a3a;
            box-shadow: 0 0 60px rgba(0,0,0,0.9);
        }

        .mines-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 12px;
            width: 330px;
            height: 330px;
        }

        .mine-cell {
            background: var(--mine-blue-grad);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.6);
            aspect-ratio: 1 / 1;
            position: relative;
        }

        .star-icon {
            width: 75%;
            height: 75%;
            filter: drop-shadow(0 0 10px #ff8c00);
            display: none;
        }

        .mine-cell.has-star .star-icon {
            display: block;
            animation: starPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes starPop {
            0% { transform: scale(0) rotate(-20deg); opacity: 0; }
            100% { transform: scale(1) rotate(0); opacity: 1; }
        }

        /* Controls */
        .controls {
            position: absolute;
            bottom: 40px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }

        .mines-config {
            background: rgba(0, 0, 0, 0.8);
            padding: 12px 24px;
            border-radius: 20px;
            border: 1px solid var(--primary-purple);
            display: flex;
            align-items: center;
            gap: 15px;
            backdrop-filter: blur(10px);
        }

        .mines-config label { font-size: 14px; font-weight: 900; color: #eee; }

        .mines-config select {
            background: #000;
            color: #fff;
            border: 1px solid var(--primary-purple);
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: 900;
            outline: none;
        }

        /* Кнопка с рассеивающимся светом */
        .signal-btn {
            background: linear-gradient(135deg, #9d00ff 0%, #7d00cc 100%);
            border: 2px solid rgba(255,255,255,0.2);
            padding: 22px 0;
            font-size: 22px;
            font-weight: 900;
            color: white;
            border-radius: 20px;
            cursor: pointer;
            text-transform: uppercase;
            width: 360px;
            max-width: 92%;
            box-shadow: 0 0 30px var(--accent-glow), 
                        0 0 60px rgba(157, 0, 255, 0.3);
            transition: all 0.4s cubic-bezier(0.2, 1, 0.3, 1);
            position: relative;
        }

        .signal-btn:hover:not(:disabled) {
            transform: translateY(-4px);
            box-shadow: 0 0 45px var(--accent-glow), 
                        0 0 90px rgba(157, 0, 255, 0.4);
            filter: brightness(1.1);
        }

        .signal-btn:active:not(:disabled) {
            transform: scale(0.95);
        }

        .signal-btn:disabled {
            background: #1a1a1a;
            box-shadow: none;
            color: #444;
            border-color: #222;
        }

        @media (max-width: 450px) {
            .mines-grid { width: 290px; height: 290px; }
            .multiplier-display { font-size: 4rem; }
        }
    </style>
</head>
<body>

    <canvas id="starBackground"></canvas>

    <nav class="tabs">
        <button class="tab-btn active" onclick="switchTab('luckyjet')">LUCKY JET</button>
        <button class="tab-btn" onclick="switchTab('mines')">MINES</button>
    </nav>

    <!-- Lucky Jet View -->
    <div id="luckyjetView" class="game-view active">
        <canvas id="gameCanvas"></canvas>
        <div id="counter" class="multiplier-display">x1.00</div>
        <div class="controls">
            <button id="jetBtn" class="signal-btn">ПОЛУЧИТЬ СИГНАЛ</button>
        </div>
    </div>

    <!-- Mines View -->
    <div id="minesView" class="game-view">
        <div class="mines-container">
            <div id="minesGrid" class="mines-grid"></div>
        </div>
        <div class="controls">
            <div class="mines-config">
                <label>КОЛ-ВО МИН:</label>
                <select id="minesCount">
                    <option value="1">1</option>
                    <option value="3" selected>3</option>
                    <option value="5">5</option>
                    <option value="10">10</option>
                    <option value="15">15</option>
                    <option value="20">20</option>
                    <option value="24">24</option>
                </select>
            </div>
            <button id="minesBtn" class="signal-btn">ПОЛУЧИТЬ СИГНАЛ</button>
        </div>
    </div>

    <script>
        // --- Фигурка персонажа 1 в 1 ---
        const luckyJoeImg = new Image();
        luckyJoeImg.src = "https://i.ibb.co/XkyY6Nf/luckyjoe.png"; // Прямая ссылка на изображение персонажа

        // --- Фон со звездами ---
        const starCanvas = document.getElementById('starBackground');
        const sCtx = starCanvas.getContext('2d');
        let stars = [];

        function initStars() {
            starCanvas.width = window.innerWidth;
            starCanvas.height = window.innerHeight;
            stars = [];
            for(let i=0; i<200; i++) {
                stars.push({
                    x: Math.random() * starCanvas.width,
                    y: Math.random() * starCanvas.height,
                    size: Math.random() * 2,
                    opacity: Math.random(),
                    speed: 0.003 + Math.random() * 0.01
                });
            }
        }

        function drawStars() {
            sCtx.clearRect(0,0,starCanvas.width, starCanvas.height);
            stars.forEach(s => {
                s.opacity += s.speed;
                if(s.opacity > 1 || s.opacity < 0) s.speed *= -1;
                sCtx.globalAlpha = Math.abs(s.opacity);
                sCtx.fillStyle = "white";
                sCtx.beginPath();
                sCtx.arc(s.x, s.y, s.size, 0, Math.PI*2);
                sCtx.fill();
            });
            requestAnimationFrame(drawStars);
        }

        // --- Переключение Вкладок ---
        function switchTab(tab) {
            document.querySelectorAll('.game-view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if(tab === 'luckyjet') {
                document.getElementById('luckyjetView').classList.add('active');
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
            } else {
                document.getElementById('minesView').classList.add('active');
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                initMinesGrid();
            }
        }

        // --- Логика MINES ---
        function initMinesGrid() {
            const grid = document.getElementById('minesGrid');
            grid.innerHTML = '';
            for (let i = 0; i < 25; i++) {
                const cell = document.createElement('div');
                cell.className = 'mine-cell';
                cell.innerHTML = `
                    <svg class="star-icon" viewBox="0 0 24 24" fill="none">
                        <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="#FF8C00" stroke="#FFD700" stroke-width="1.5"/>
                    </svg>
                `;
                grid.appendChild(cell);
            }
        }

        document.getElementById('minesBtn').addEventListener('click', function() {
            const btn = this;
            btn.disabled = true;
            btn.innerText = "АНАЛИЗ...";
            document.querySelectorAll('.mine-cell').forEach(c => c.classList.remove('has-star'));

            setTimeout(() => {
                const count = parseInt(document.getElementById('minesCount').value);
                let starsCount = 5;
                if(count >= 15) starsCount = 3;
                if(count <= 3) starsCount = 6;
                if(count == 24) starsCount = 1;

                const cells = Array.from(document.querySelectorAll('.mine-cell'));
                const chosen = cells.sort(() => 0.5 - Math.random()).slice(0, starsCount);
                
                chosen.forEach((c, i) => {
                    setTimeout(() => c.classList.add('has-star'), i * 180);
                });

                btn.disabled = false;
                btn.innerText = "ПОЛУЧИТЬ СИГНАЛ";
            }, 1200);
        });

        // --- Логика LUCKY JET ---
        const jetCanvas = document.getElementById('gameCanvas');
        const jCtx = jetCanvas.getContext('2d');
        let jWidth, jHeight, isFlying = false, currentX = 1.0, targetX = 1.0, startTime = 0;

        function resizeJet() {
            jWidth = jetCanvas.width = window.innerWidth;
            jHeight = jetCanvas.height = window.innerHeight;
        }

        function drawLuckyJet() {
            jCtx.clearRect(0,0,jWidth, jHeight);
            let px = 80, py = jHeight - 150;

            if(isFlying) {
                const t = Math.min((Date.now() - startTime) / 3000, 1);
                // Плавная траектория взлета (параболическая)
                px = 80 + (jWidth * 0.7) * (1 - Math.pow(1-t, 2.5));
                py = (jHeight - 150) - (jHeight * 0.7) * (1 - Math.pow(1-t, 4.5));
                
                if(currentX < targetX) {
                    currentX += 0.015 + (currentX * 0.008);
                } else {
                    currentX = targetX;
                    isFlying = false;
                    document.getElementById('jetBtn').disabled = false;
                }

                // Рисуем линию графика с градиентом
                jCtx.beginPath();
                jCtx.moveTo(80, jHeight - 150);
                jCtx.quadraticCurveTo(80 + (px-80)*0.4, jHeight-150, px, py);
                const grad = jCtx.createLinearGradient(80, jHeight-150, px, py);
                grad.addColorStop(0, "rgba(157, 0, 255, 0)");
                grad.addColorStop(1, "rgba(157, 0, 255, 0.8)");
                jCtx.strokeStyle = grad; 
                jCtx.lineWidth = 6; 
                jCtx.stroke();
            }

            // Отрисовка Лаки Джо (из изображения)
            jCtx.save();
            jCtx.translate(px, py);
            
            // Если картинка загружена, рисуем её
            if (luckyJoeImg.complete) {
                const imgW = 140; // Размер персонажа
                const imgH = 140;
                jCtx.drawImage(luckyJoeImg, -imgW/2, -imgH/2, imgW, imgH);
                
                // Эффект огня (анимированный рандом)
                if(isFlying) {
                    const fireSize = 30 + Math.random() * 20;
                    jCtx.fillStyle = "#ff4400";
                    jCtx.beginPath();
                    jCtx.moveTo(-60, 15);
                    jCtx.lineTo(-60 - fireSize, 25);
                    jCtx.lineTo(-60, 35);
                    jCtx.fill();
                }
            } else {
                // Заглушка, если картинка ещё не загрузилась
                jCtx.fillStyle = "#facc15";
                jCtx.beginPath(); jCtx.arc(0,0,30,0,Math.PI*2); jCtx.fill();
            }
            jCtx.restore();

            document.getElementById('counter').innerText = 'x' + currentX.toFixed(2);
            requestAnimationFrame(drawLuckyJet);
        }

        document.getElementById('jetBtn').addEventListener('click', function() {
            this.disabled = true;
            targetX = Math.random() < 0.85 ? 1.5 + Math.random() * 4 : 5 + Math.random() * 25;
            currentX = 1.0;
            startTime = Date.now();
            isFlying = true;
        });

        window.addEventListener('resize', () => { initStars(); resizeJet(); });
        initStars();
        drawStars();
        resizeJet();
        drawLuckyJet();
        initMinesGrid();
    </script>
</body>
</html>
