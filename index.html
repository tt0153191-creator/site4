<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Jet & Mines Premium Signals</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap');

        :root {
            --primary-purple: #9d00ff;
            --bright-purple: #c342ff;
            --accent-glow: rgba(189, 0, 255, 0.8);
            --bg-dark: #05040d;
            --text-white: #ffffff;
            --mine-blue-grad: linear-gradient(145deg, #235d81, #0a2535);
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg-dark);
            font-family: 'Roboto', sans-serif;
            height: 100vh;
            color: var(--text-white);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        #starBackground {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .tabs {
            display: flex;
            background: rgba(15, 12, 41, 0.95);
            backdrop-filter: blur(15px);
            padding: 15px;
            gap: 15px;
            justify-content: center;
            z-index: 100;
            border-bottom: 2px solid rgba(157, 0, 255, 0.4);
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(157, 0, 255, 0.5);
            color: white;
            padding: 12px 25px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 900;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: var(--primary-purple);
            box-shadow: 0 0 25px var(--primary-purple);
            border-color: var(--bright-purple);
        }

        .game-view {
            flex: 1;
            display: none;
            position: relative;
            flex-direction: column;
            align-items: center;
            z-index: 1;
        }

        .game-view.active { display: flex; }

        #gameCanvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
        }

        .multiplier-display {
            position: absolute;
            top: 38%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: clamp(3.5rem, 12vw, 7rem);
            font-weight: 900;
            color: var(--bright-purple);
            text-shadow: 0 0 30px var(--bright-purple), 0 0 60px rgba(189, 0, 255, 0.5);
            z-index: 5;
            pointer-events: none;
        }

        .controls {
            position: absolute;
            bottom: 40px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }

        .signal-btn {
            background: linear-gradient(135deg, #9d00ff 0%, #7d00cc 100%);
            border: 2px solid rgba(255,255,255,0.2);
            padding: 22px 0;
            font-size: 22px;
            font-weight: 900;
            color: white;
            border-radius: 20px;
            cursor: pointer;
            text-transform: uppercase;
            width: 360px;
            max-width: 92%;
            box-shadow: 0 0 35px var(--accent-glow), 0 0 70px rgba(157, 0, 255, 0.3);
            transition: all 0.4s cubic-bezier(0.2, 1, 0.3, 1);
        }

        .signal-btn:disabled {
            background: #1a1a1a;
            box-shadow: none;
            color: #444;
            border-color: #222;
        }

        .mines-container {
            margin-top: 40px;
            background: rgba(10, 20, 35, 0.95);
            padding: 20px;
            border-radius: 28px;
            border: 3px solid #1e2a3a;
        }

        .mines-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            width: 320px;
            height: 320px;
        }

        .mine-cell {
            background: var(--mine-blue-grad);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <canvas id="starBackground"></canvas>

    <nav class="tabs">
        <button class="tab-btn active" onclick="switchTab('luckyjet')">LUCKY JET</button>
        <button class="tab-btn" onclick="switchTab('mines')">MINES</button>
    </nav>

    <div id="luckyjetView" class="game-view active">
        <canvas id="gameCanvas"></canvas>
        <div id="counter" class="multiplier-display">x1.00</div>
        <div class="controls">
            <button id="jetBtn" class="signal-btn">ПОЛУЧИТЬ СИГНАЛ</button>
        </div>
    </div>

    <div id="minesView" class="game-view">
        <div class="mines-container">
            <div id="minesGrid" class="mines-grid"></div>
        </div>
        <div class="controls">
            <button id="minesBtn" class="signal-btn">ПОЛУЧИТЬ СИГНАЛ</button>
        </div>
    </div>

    <script>
        // --- ОБРАБОТКА ИЗОБРАЖЕНИЯ (ЧЕТКОСТЬ И ПРОЗРАЧНОСТЬ) ---
        let processedJoe = null;
        const luckyJoeImg = new Image();
        luckyJoeImg.crossOrigin = "anonymous";
        luckyJoeImg.src = "https://yt3.googleusercontent.com/DxUsF2Faj_l76Z-2Daj1WlM5to6QK_Tv4D1dCnslf7tzxJHS2RF5guuY-xTF6Nw3I_KJMLFaFQ=s900-c-k-c0x00ffffff-no-rj"; 

        luckyJoeImg.onload = function() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = luckyJoeImg.width;
            canvas.height = luckyJoeImg.height;
            ctx.drawImage(luckyJoeImg, 0, 0);
            
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            
            for (let i = 0; i < data.length; i += 4) {
                const r = data[i], g = data[i+1], b = data[i+2];
                const brightness = (r + g + b) / 3;
                if (brightness > 230) {
                    data[i + 3] = 0; 
                } else if (brightness > 200) {
                    data[i + 3] = (255 - brightness) * 4;
                }
            }
            ctx.putImageData(imageData, 0, 0);
            processedJoe = canvas;
        };

        // --- ФОН СО ЗВЕЗДАМИ ---
        const starCanvas = document.getElementById('starBackground');
        const sCtx = starCanvas.getContext('2d');
        let stars = [];

        function initStars() {
            starCanvas.width = window.innerWidth;
            starCanvas.height = window.innerHeight;
            stars = [];
            for(let i=0; i<150; i++) {
                stars.push({
                    x: Math.random() * starCanvas.width,
                    y: Math.random() * starCanvas.height,
                    size: Math.random() * 1.5,
                    opacity: Math.random(),
                    speed: 0.005 + Math.random() * 0.01
                });
            }
        }

        function drawStars() {
            sCtx.clearRect(0,0,starCanvas.width, starCanvas.height);
            stars.forEach(s => {
                s.opacity += s.speed;
                if(s.opacity > 1 || s.opacity < 0) s.speed *= -1;
                sCtx.globalAlpha = Math.max(0, Math.abs(s.opacity));
                sCtx.fillStyle = "white";
                sCtx.beginPath();
                sCtx.arc(s.x, s.y, s.size, 0, Math.PI*2);
                sCtx.fill();
            });
            requestAnimationFrame(drawStars);
        }

        // --- LUCKY JET ЛОГИКА ---
        const jetCanvas = document.getElementById('gameCanvas');
        const jCtx = jetCanvas.getContext('2d');
        let jWidth, jHeight, isFlying = false, isFalling = false, currentX = 1.0, targetX = 1.0, startTime = 0, fallTime = 0;

        function resizeJet() {
            jWidth = jetCanvas.width = window.innerWidth;
            jHeight = jetCanvas.height = window.innerHeight;
        }

        // Траектория взлета
        function getTrajectory(t, startX, startY, width, height) {
            const px = startX + (width * 0.75) * t;
            const py = startY - (height * 0.65) * Math.pow(t, 1.5); 
            return { x: px, y: py };
        }

        // Состояние персонажа
        let pos = { x: 60, y: 0 };
        let rotation = -0.3;
        let lineOpacity = 1;

        function drawLuckyJet() {
            jCtx.clearRect(0,0,jWidth, jHeight);
            jCtx.imageSmoothingEnabled = true;
            jCtx.imageSmoothingQuality = 'high';

            const startX = 60;
            const startY = jHeight - 120;

            if (isFlying) {
                const elapsed = Date.now() - startTime;
                const duration = 2800;
                const t = Math.min(elapsed / duration, 1);
                
                pos = getTrajectory(t, startX, startY, jWidth, jHeight);
                rotation = -0.3;
                lineOpacity = 1;
                
                // Рисуем сияющую линию
                jCtx.save();
                jCtx.beginPath();
                jCtx.moveTo(startX, startY);
                for (let i = 0.01; i <= t; i += 0.01) {
                    const p = getTrajectory(i, startX, startY, jWidth, jHeight);
                    jCtx.lineTo(p.x, p.y);
                }
                jCtx.shadowBlur = 15;
                jCtx.shadowColor = "rgba(157, 0, 255, 1)";
                jCtx.strokeStyle = "rgba(195, 66, 255, 0.5)";
                jCtx.lineWidth = 6;
                jCtx.lineCap = "round";
                jCtx.stroke();
                jCtx.shadowBlur = 5;
                jCtx.strokeStyle = "white";
                jCtx.lineWidth = 2;
                jCtx.stroke();
                jCtx.restore();

                if(currentX < targetX) {
                    currentX += (targetX - currentX) * 0.02 + 0.01;
                } else {
                    currentX = targetX;
                    if (t >= 1) {
                        isFlying = false;
                        isFalling = true;
                        fallTime = Date.now();
                    }
                }
            } else if (isFalling) {
                const elapsedFall = Date.now() - fallTime;
                const tFall = elapsedFall / 1000; // Секунды с начала падения

                // Логика падения: физика свободного падения + горизонтальная инерция
                pos.y += (9.8 * tFall * 5); // Ускорение вниз
                pos.x += 2; // Небольшая инерция вправо
                rotation += 0.1; // Вращение при падении
                lineOpacity = Math.max(0, 1 - tFall * 2); // Исчезновение линии

                // Отрисовка затухающей линии
                if (lineOpacity > 0) {
                    jCtx.save();
                    jCtx.globalAlpha = lineOpacity;
                    jCtx.beginPath();
                    jCtx.moveTo(startX, startY);
                    for (let i = 0.01; i <= 1; i += 0.01) {
                        const p = getTrajectory(i, startX, startY, jWidth, jHeight);
                        jCtx.lineTo(p.x, p.y);
                    }
                    jCtx.strokeStyle = "rgba(195, 66, 255, 0.5)";
                    jCtx.lineWidth = 4;
                    jCtx.stroke();
                    jCtx.restore();
                }

                // Если упал за экран
                if (pos.y > jHeight + 100) {
                    isFalling = false;
                    document.getElementById('jetBtn').disabled = false;
                }
            } else {
                // Статичное состояние до начала
                pos.x = startX;
                pos.y = startY;
                rotation = 0;
            }

            // Отрисовка персонажа
            jCtx.save();
            jCtx.translate(pos.x, pos.y);
            jCtx.rotate(rotation);
            
            const hover = (isFlying || !isFalling) ? Math.sin(Date.now() / 150) * 4 : 0;
            jCtx.translate(0, hover);

            if (processedJoe) {
                const h = 100; 
                const w = processedJoe.width * (h / processedJoe.height);
                jCtx.drawImage(processedJoe, -w * 0.5, -h * 0.7, w, h);
            }
            jCtx.restore();

            document.getElementById('counter').innerText = 'x' + currentX.toFixed(2);
            requestAnimationFrame(drawLuckyJet);
        }

        document.getElementById('jetBtn').addEventListener('click', function() {
            this.disabled = true;
            targetX = 1.25 + Math.random() * 9;
            currentX = 1.0;
            startTime = Date.now();
            isFlying = true;
            isFalling = false;
        });

        function switchTab(tab) {
            document.querySelectorAll('.game-view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if(tab === 'luckyjet') {
                document.getElementById('luckyjetView').classList.add('active');
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
            } else {
                document.getElementById('minesView').classList.add('active');
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                initMinesGrid();
            }
        }

        function initMinesGrid() {
            const grid = document.getElementById('minesGrid');
            grid.innerHTML = '';
            for (let i = 0; i < 25; i++) {
                const cell = document.createElement('div');
                cell.className = 'mine-cell';
                grid.appendChild(cell);
            }
        }

        window.addEventListener('resize', () => { initStars(); resizeJet(); });
        initStars();
        drawStars();
        resizeJet();
        drawLuckyJet();
    </script>
</body>
</html>
